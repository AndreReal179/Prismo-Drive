name: Gerar Prismo Drive Admin (Windows)

# Gera o instalador PrismoDriveAdmin-Setup-<versão>.exe do programa do administrador.
# Fica num Release separado (pré-lançamento): não interfere nas atualizações do app dos clientes.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'PrismoAdmin/**'
      - '.github/workflows/build-admin.yml'

permissions:
  contents: write

concurrency:
  group: gerar-admin
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: PrismoAdmin
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar instalador .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Versão
        id: v
        shell: bash
        run: echo "versao=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Guardar o instalador (aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PrismoDriveAdmin-Setup-${{ steps.v.outputs.versao }}
          path: PrismoAdmin/dist/*.exe
          retention-days: 90

      - name: Publicar no Release do Admin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v${{ steps.v.outputs.versao }}
          name: Prismo Drive Admin ${{ steps.v.outputs.versao }} (Windows)
          body: |
            Programa do administrador do Prismo Drive para Windows.
            Baixe o arquivo PrismoDriveAdmin-Setup-${{ steps.v.outputs.versao }}.exe abaixo e instale.
            Entre com a sua conta de administrador (e-mail e senha).
          files: PrismoAdmin/dist/*.exe
          prerelease: true
          make_latest: false
          overwrite_files: true
