
name: Manter apenas 3 releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Remover releases antigas
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 }
            );

            const published = releases
              .filter(release => !release.draft)
              .sort((a, b) =>
                new Date(b.published_at || b.created_at) -
                new Date(a.published_at || a.created_at)
              );

            const oldReleases = published.slice(3);

            for (const release of oldReleases) {
              console.log(`Excluindo: ${release.name || release.tag_name}`);

              await github.rest.repos.deleteRelease({
                owner,
                repo,
                release_id: release.id
              });
            }

            console.log(
              `Finalizado. ${Math.min(published.length, 3)} releases mantidas.`
            );
