name: Gerar APK Prismo Drive

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (usa o SDK que já vem no GitHub)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "SDK pronto em $ANDROID_HOME"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore (assinatura)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/prismo-drive-key.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/prismo-drive-key.p12" >> "$GITHUB_ENV"
            echo "Keystore carregada."
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado — o APK sairá com assinatura de TESTE e não vai atualizar o app instalado."
          fi

      - name: Compilar APK (release)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          ESPERADO="cd18a0a039b563724f2edcdb17d101793f92f49de8c0d3996ee6d7dd0cdb61c6"
          ATUAL=$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$ATUAL" = "$ESPERADO" ]; then
            echo "::notice::Assinatura igual à da v1.6 — o APK atualiza o app instalado sem perder dados."
          else
            echo "::warning::Assinatura DIFERENTE da v1.6 ($ATUAL). O Android não vai atualizar por cima do app instalado; será preciso desinstalar (os dados salvos no app serão perdidos)."
          fi

      - name: Renomear APK
        run: |
          VERSAO=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p saida
          cp app/build/outputs/apk/release/*.apk "saida/PrismoDrive_v${VERSAO}.apk"
          ls -la saida

      - name: Enviar APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PrismoDrive-apk
          path: saida/*.apk
          retention-days: 30

      - name: Publicar Release (quando for tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: saida/*.apk
