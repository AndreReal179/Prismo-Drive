name: Gerar APK Prismo Drive

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar como atualização para os usuários (Release)?'
        type: boolean
        default: true
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'README.md'
      - '**/README.md'

permissions:
  contents: write

concurrency:
  group: gerar-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      REPO_ATUALIZACAO: ${{ vars.REPO_ATUALIZACAO }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (usa o SDK que já vem no GitHub)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1); fi
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "SDK pronto em $ANDROID_HOME"

      - name: Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Localizar o projeto e definir versão
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          ARQ=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          if [ -z "$ARQ" ]; then echo "::error::settings.gradle.kts não encontrado. Envie a pasta do projeto para o repositório."; exit 1; fi
          PROJ=$(dirname "$ARQ")
          BASE=$(grep -m1 -E '^\s*versionName\s*=' "$PROJ/app/build.gradle.kts" | sed -E 's/.*"(.*)".*/\1/')
          # Numeração: 1.9 → 1.9.1 … 1.9.9 → 2.0 → 2.0.1 … 2.0.9 → 2.1 … 2.9.9 → 3.0
          # (pega a maior versão já publicada e soma 1; build que falha não publica, então não pula número.
          #  Se o versionName do build.gradle.kts for maior que a última publicada, começa por ele.)
          REPO_REL="${REPO_ATUALIZACAO:-${{ github.repository }}}"
          TAGS=$(gh release list --repo "$REPO_REL" --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          VERSAO=$(BASE="$BASE" TAGS="$TAGS" python3 - <<'PY'
          import os,re
          def p(v):
              m=re.fullmatch(r'v?(\d+)\.(\d+)(?:\.(\d+))?',v.strip())
              return (int(m.group(1)),int(m.group(2)),int(m.group(3) or 0)) if m else None
          def txt(t): return f"{t[0]}.{t[1]}" if t[2]==0 else f"{t[0]}.{t[1]}.{t[2]}"
          tags=[t for t in (p(x) for x in os.environ.get('TAGS','').split()) if t]
          base=p(os.environ.get('BASE','1.0')) or (1,0,0)
          if not tags or base>max(tags):
              print(txt(base))
          else:
              a,b,c=max(tags)
              if c<9: c+=1
              else:
                  c=0
                  if b<9: b+=1
                  else: a,b=a+1,0
              print(txt((a,b,c)))
          PY
          )
          # versionCode automático: minutos desde 01/11/2026 (sempre maior que o anterior)
          CODIGO=$(( 100 + $(date +%s) / 60 - 29891520 ))
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "VERSAO=$VERSAO" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODIGO" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSAO" >> "$GITHUB_ENV"
          echo "Projeto: $PROJ | versão $VERSAO | versionCode $CODIGO"
          if [ "${{ github.event.repository.private }}" = "true" ] && [ -z "$REPO_ATUALIZACAO" ]; then
            echo "::warning::Este repositório é PRIVADO: o app não consegue ler os Releases daqui. Torne o repositório público ou configure a variável REPO_ATUALIZACAO (veja o README)."
          fi

      - name: Preparar keystore (assinatura)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/prismo-drive-key.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/prismo-drive-key.p12" >> "$GITHUB_ENV"
            echo "ASSINADO=1" >> "$GITHUB_ENV"
            echo "Keystore carregada."
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado — o APK sai com assinatura de TESTE e NÃO será publicado como atualização."
          fi

      - name: Compilar APK (release)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}   # Novidades: lê as notas das versões publicadas
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd "$PROJ"
          gradle assembleRelease --no-daemon --stacktrace

      - name: Conferir assinatura
        run: |
          APK=$(ls "$PROJ"/app/build/outputs/apk/release/*.apk | head -n1)
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner
          "$SIGNER" verify --print-certs "$APK" | tee certs.txt
          ESPERADO="cd18a0a039b563724f2edcdb17d101793f92f49de8c0d3996ee6d7dd0cdb61c6"
          ATUAL=$(grep -m1 "SHA-256 digest" certs.txt | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          if [ "$ATUAL" = "$ESPERADO" ]; then
            echo "::notice::Assinatura igual à da v1.6 — instala por cima sem perder dados."
          else
            echo "::warning::Assinatura diferente da v1.6 ($ATUAL). Quem tem a v1.6 precisa desinstalar uma vez; daqui pra frente as atualizações automáticas usam esta chave."
          fi

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp "$PROJ"/app/build/outputs/apk/release/*.apk "saida/PrismoDrive_v${VERSAO}.apk"
          cp "saida/PrismoDrive_v${VERSAO}.apk" "saida/PrismoDrive.apk"
          ls -la saida

      - name: Enviar APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: PrismoDrive_v${{ env.VERSAO }}
          path: saida/PrismoDrive_v${{ env.VERSAO }}.apk
          retention-days: 30

      - name: Montar notas da atualização
        run: |
          {
            echo "<!-- versionCode: $VERSION_CODE -->"
            echo "<!-- versionName: $VERSAO -->"
            if [ -f "$PROJ/NOVIDADES.md" ]; then cat "$PROJ/NOVIDADES.md"; else echo "Melhorias e correções."; fi
          } > notas.md
          cat notas.md
          # versao.json: o app lê este arquivo (sem usar a API do GitHub, que tem limite por hora)
          REPO_REL="${REPO_ATUALIZACAO:-${{ github.repository }}}"
          NOTAS_TXT=$(if [ -f "$PROJ/NOVIDADES.md" ]; then cat "$PROJ/NOVIDADES.md"; else echo "Melhorias e correções."; fi)
          jq -n \
            --arg vn "$VERSAO" \
            --argjson vc "$VERSION_CODE" \
            --arg notas "$NOTAS_TXT" \
            --arg url "https://github.com/$REPO_REL/releases/download/v$VERSAO/PrismoDrive.apk" \
            --argjson tam "$(stat -c %s saida/PrismoDrive.apk)" \
            --arg data "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionName:$vn, versionCode:$vc, notas:$notas, url:$url, tamanho:$tam, data:$data}' > saida/versao.json
          cat saida/versao.json

      - name: Publicar atualização (Release)
        if: env.ASSINADO == '1' && (github.event_name == 'push' || inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSAO }}
          name: Prismo Drive ${{ env.VERSAO }}
          body_path: notas.md
          files: |
            saida/PrismoDrive_v${{ env.VERSAO }}.apk
            saida/PrismoDrive.apk
            saida/versao.json
          make_latest: true
          repository: ${{ vars.REPO_ATUALIZACAO || github.repository }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Resumo
        if: always()
        run: |
          if [ "${{ job.status }}" != "success" ]; then
            echo "::error::O build falhou. Se o erro fala em 'keystore password was incorrect' ou 'Failed to read key', a senha em KEYSTORE_PASSWORD não bate com a keystore de KEYSTORE_BASE64."
            echo "### ❌ Build falhou — nenhuma atualização publicada" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$ASSINADO" != "1" ]; then
            echo "::error::APK gerado, mas a atualização NÃO foi publicada: faltam os secrets KEYSTORE_BASE64 e KEYSTORE_PASSWORD."
            echo "### ⚠️ Atualização NÃO publicada (faltam os secrets da keystore)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ✅ Prismo Drive $VERSAO publicado (versionCode $VERSION_CODE)" >> "$GITHUB_STEP_SUMMARY"
          fi
